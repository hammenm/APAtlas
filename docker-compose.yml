services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:6543:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STEAM_API_KEY: ${STEAM_API_KEY}
    ports:
      # Run locally only: nginx does the reverse proxy
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  scraper:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    # Does not start with "docker compose up": launch with cron with "docker compose run --rm scraper"
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT}
    volumes:
      - ./storage/images:/app/storage/images
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
